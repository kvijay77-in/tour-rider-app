name: Deploy Cognito Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy Cognito — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Cognito stack
        id: deploy
        run: |
          STACK_NAME="tour-rider-cognito-${{ github.event.inputs.environment }}"
          echo "Deploying stack: ${STACK_NAME}"

          aws cloudformation deploy \
            --template-file cloudformation/rider-cognito.yaml \
            --stack-name "${STACK_NAME}" \
            --capabilities CAPABILITY_IAM \
            --parameter-overrides "Environment=${{ github.event.inputs.environment }}" \
            --no-fail-on-empty-changeset \
            --tags \
              "Project=tour-rider-app" \
              "Environment=${{ github.event.inputs.environment }}" \
              "ManagedBy=CloudFormation"

          # Extract outputs
          USER_POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='RiderUserPoolId'].OutputValue" \
            --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='RiderUserPoolClientId'].OutputValue" \
            --output text)

          echo "user_pool_id=${USER_POOL_ID}" >> "$GITHUB_OUTPUT"
          echo "client_id=${CLIENT_ID}" >> "$GITHUB_OUTPUT"

      - name: Print outputs
        run: |
          echo "============================================"
          echo "Cognito Resources Deployed Successfully"
          echo "============================================"
          echo ""
          echo "Environment: ${{ github.event.inputs.environment }}"
          echo "User Pool ID: ${{ steps.deploy.outputs.user_pool_id }}"
          echo "Client ID: ${{ steps.deploy.outputs.client_id }}"
          echo ""
          echo "Add these to your .env file:"
          echo "  EXPO_PUBLIC_AWS_USER_POOL_ID=${{ steps.deploy.outputs.user_pool_id }}"
          echo "  EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID=${{ steps.deploy.outputs.client_id }}"
          echo "============================================"
