AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Tour Rider App — Cognito User Pool

  Creates a dedicated Cognito User Pool for riders, separate from
  the tour-mgmt-app (Check-In App) staff pool.

  All users in this pool are riders — no group-based RBAC required.
  The tour-data-api backend must be configured to accept JWT tokens
  from this pool in addition to the staff pool.

  Usage:
    aws cloudformation deploy \
      --template-file cloudformation/rider-cognito.yaml \
      --stack-name tour-rider-cognito-dev \
      --capabilities CAPABILITY_IAM \
      --parameter-overrides Environment=dev

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: Environment name (dev, test, or prod)

Resources:
  # ============================================================================
  # COGNITO USER POOL — Dedicated pool for riders
  # ============================================================================

  RiderUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'tour-rider-${Environment}-users'
      # Riders sign in with email
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      # Password policy — same as tour-data-api for consistency
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      # Schema attributes
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        # Custom attribute: Cognito auto-adds the 'custom:' prefix.
        # Accessible as 'custom:profileId' in JWT tokens and SDK.
        # Links to RiderProfile table in tour-data-api.
        - Name: profileId
          AttributeDataType: String
          Mutable: true
          Required: false
      # Self-registration — riders can create their own accounts
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      # Email verification message
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'Tour Rider App — Verify your email'
        EmailMessage: 'Your verification code is {####}'
      # Account recovery via email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      UserPoolTags:
        Project: tour-rider-app
        Environment: !Ref Environment
        ManagedBy: CloudFormation

  # ============================================================================
  # COGNITO USER POOL CLIENT — For the rider mobile/web app
  # ============================================================================

  RiderUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'tour-rider-${Environment}-app-client'
      UserPoolId: !Ref RiderUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      # No secret — required for mobile/web clients
      GenerateSecret: false
      # Token validity
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      # Prevent user-existence errors for security
      PreventUserExistenceErrors: ENABLED

# ============================================================================
# OUTPUTS
# ============================================================================

Outputs:
  RiderUserPoolId:
    Description: Cognito User Pool ID for the Tour Rider App
    Value: !Ref RiderUserPool
    Export:
      Name: !Sub 'tour-rider-${Environment}-UserPoolId'

  RiderUserPoolArn:
    Description: Cognito User Pool ARN for the Tour Rider App
    Value: !GetAtt RiderUserPool.Arn
    Export:
      Name: !Sub 'tour-rider-${Environment}-UserPoolArn'

  RiderUserPoolClientId:
    Description: Cognito App Client ID for the Tour Rider App
    Value: !Ref RiderUserPoolClient
    Export:
      Name: !Sub 'tour-rider-${Environment}-AppClientId'

  EnvironmentVariables:
    Description: >
      Copy these values into your .env file (replace placeholders):
        EXPO_PUBLIC_AWS_USER_POOL_ID=<RiderUserPoolId>
        EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID=<RiderUserPoolClientId>
    Value: !Sub |
      EXPO_PUBLIC_AWS_USER_POOL_ID=${RiderUserPool}
      EXPO_PUBLIC_AWS_USER_POOL_WEB_CLIENT_ID=${RiderUserPoolClient}
